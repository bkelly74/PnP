name: Supabase Keep-Alive

# Keeps a Supabase free-tier project from pausing (it sleeps after ~7 days of
# inactivity). Runs a small daily REST request that touches the database.
#
# SETUP (one-time):
#   1. Add two repo secrets — Settings ▸ Secrets and variables ▸ Actions ▸ New secret:
#        SUPABASE_URL       e.g. https://YOURPROJECT.supabase.co   (no trailing slash)
#        SUPABASE_ANON_KEY  the project's anon/public API key
#   2. This workflow must live on the repository's DEFAULT branch for the daily
#      schedule to fire (GitHub only runs scheduled workflows from the default branch).
#   3. Test it now: Actions ▸ Supabase Keep-Alive ▸ Run workflow.

on:
  schedule:
    - cron: '19 7 * * *'   # daily at 07:19 UTC (off-peak minute)
  workflow_dispatch:        # manual "Run workflow" button

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Set SUPABASE_URL and SUPABASE_ANON_KEY repo secrets."; exit 1
          fi
          # GET /rest/v1/ returns the API schema — this hits PostgREST + the DB,
          # which counts as activity and needs no specific table.
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            "${SUPABASE_URL%/}/rest/v1/" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          echo "Supabase responded: HTTP $code"
          case "$code" in
            2*|3*) echo "Keep-alive OK." ;;
            *) echo "::error::Unexpected status $code"; exit 1 ;;
          esac
