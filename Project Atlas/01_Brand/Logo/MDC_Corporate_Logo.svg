<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1720 520" role="img" aria-label="The Match Day Club corporate logo">
  <title>The Match Day Club — Corporate Logo (shield + wordmark)</title>
  <!--
    Horizontal lockup: shield mark + "THE MATCH DAY CLUB" wordmark, mirroring the live brand.
    Type: Anton (display) + Archivo (CLUB). Production should outline the wordmark to vector.
  -->
  <style>@import url('https://fonts.googleapis.com/css2?family=Anton&amp;family=Archivo:wght@800&amp;display=swap');</style>
  <defs>
    <mask id="cHollow">
      <rect width="1000" height="1000" fill="black"/>
      <path d="M330 700 L330 285 L500 500 L670 285 L670 700" fill="none" stroke="white" stroke-width="78" stroke-linejoin="miter" stroke-miterlimit="9"/>
      <path d="M330 700 L330 285 L500 500 L670 285 L670 700" fill="none" stroke="black" stroke-width="30" stroke-linejoin="miter" stroke-miterlimit="9"/>
    </mask>
  </defs>

  <!-- Shield mark, scaled into the left -->
  <g transform="translate(40 35) scale(0.45)">
    <path fill-rule="evenodd" fill="#F5F7F8" d="
      M200 140 L800 140 L800 620 L500 885 L200 620 Z
      M252 196 L748 196 L748 596 L500 812 L252 596 Z"/>
    <path fill="#8BC63F" d="M448 286 L552 286 L500 392 Z"/>
    <rect width="1000" height="1000" fill="#F5F7F8" mask="url(#cHollow)"/>
    <rect x="482" y="500" width="36" height="205" fill="#8BC63F"/>
  </g>

  <!-- Wordmark -->
  <text x="560" y="190" font-family="Anton, Impact, sans-serif" font-size="58" letter-spacing="11" fill="#8BC63F">THE</text>
  <text x="554" y="338" font-family="Anton, Impact, sans-serif" font-size="156" letter-spacing="2" fill="#F5F7F8">MATCH DAY</text>
  <text x="558" y="412" font-family="Archivo, Arial, sans-serif" font-weight="800" font-size="54" letter-spacing="27" fill="#F5F7F8">CLUB</text>
</svg>
