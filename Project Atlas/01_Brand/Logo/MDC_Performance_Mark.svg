<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-label="Matchday Club Performance Mark">
  <title>Matchday Club — Performance Mark (manufacturing)</title>
  <!--
    Single ascending chevron. Constant perpendicular stroke (no thin tapers).
    Top edge (350->545) and bottom edge (480->675) are parallel: production-safe
    for embroidery, knit, silicone and woven labels.
  -->
  <path d="M500 350 L700 545 L700 675 L500 480 L300 675 L300 545 Z" fill="#0E0E0E"/>
</svg>
