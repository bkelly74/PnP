<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-label="The Match Day Club shield construction">
  <title>The Match Day Club — Shield Construction Grid</title>
  <!-- Construction reference for the reconstructed mark. Grid at 100u; centre axis x=500. -->
  <g stroke="#23282F" stroke-width="1" fill="none">
    <path d="M0 100 H1000 M0 200 H1000 M0 300 H1000 M0 400 H1000 M0 500 H1000 M0 600 H1000 M0 700 H1000 M0 800 H1000 M0 900 H1000"/>
    <path d="M100 0 V1000 M200 0 V1000 M300 0 V1000 M400 0 V1000 M500 0 V1000 M600 0 V1000 M700 0 V1000 M800 0 V1000 M900 0 V1000"/>
  </g>
  <line x1="500" y1="0" x2="500" y2="1000" stroke="#8BC63F" stroke-width="2" stroke-dasharray="6 6"/>
  <!-- Outer + inner shield keylines -->
  <path d="M200 140 L800 140 L800 620 L500 885 L200 620 Z" fill="none" stroke="#F5F7F8" stroke-width="3"/>
  <path d="M252 196 L748 196 L748 596 L500 812 L252 596 Z" fill="none" stroke="#F5F7F8" stroke-width="3"/>
  <!-- M monogram centreline -->
  <path d="M330 700 L330 285 L500 500 L670 285 L670 700" fill="none" stroke="#F5F7F8" stroke-width="3" stroke-dasharray="8 6"/>
  <!-- Green chevron + accent stem outlines -->
  <path d="M448 286 L552 286 L500 392 Z" fill="none" stroke="#8BC63F" stroke-width="3"/>
  <rect x="482" y="500" width="36" height="205" fill="none" stroke="#8BC63F" stroke-width="3"/>
</svg>
