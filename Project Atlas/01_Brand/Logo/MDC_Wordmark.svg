<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 360" role="img" aria-label="The Match Day Club wordmark">
  <title>The Match Day Club — Wordmark</title>
  <!--
    Live-text lockup in the real brand type: Anton (display) + Archivo (CLUB), per the live site.
    "THE" in Green; "MATCH DAY" and "CLUB" in Ink. Production should outline these to vector;
    kept as editable text here so the lockup stays adjustable. Renders where webfonts are reachable.
  -->
  <style>@import url('https://fonts.googleapis.com/css2?family=Anton&amp;family=Archivo:wght@800&amp;display=swap');</style>
  <text x="8" y="78" font-family="Anton, Impact, sans-serif" font-size="62" letter-spacing="12" fill="#8BC63F">THE</text>
  <text x="2" y="238" font-family="Anton, Impact, sans-serif" font-size="170" letter-spacing="2" fill="#F5F7F8">MATCH DAY</text>
  <text x="6" y="320" font-family="Archivo, Arial, sans-serif" font-weight="800" font-size="60" letter-spacing="30" fill="#F5F7F8">CLUB</text>
</svg>
