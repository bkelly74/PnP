<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1180" role="img" aria-label="Matchday Club shield clear space">
  <title>Matchday Club — Clear Space</title>
  <!--
    Clear space = X on all sides, where X = Performance Mark stroke height = 130u
    at master scale (chevron edges run 545->675 at x=700: a 130u perpendicular band).
    Shield master bbox: x 180..820, y 150..880. Keep-out = bbox expanded by X:
    left 50, right 950, top 20, bottom 1010. Nothing may intrude into this zone.
  -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2A2A2A"/>
    </marker>
  </defs>

  <!-- Keep-out boundary -->
  <rect x="50" y="20" width="900" height="990" fill="none" stroke="#14342B" stroke-width="3" stroke-dasharray="14 10"/>

  <!-- Shield -->
  <g>
    <path d="M180 150 L820 150 L820 520 C820 700 700 800 500 880 C300 800 180 700 180 520 Z" fill="#0E0E0E"/>
    <path d="M500 350 L700 545 L700 675 L500 480 L300 675 L300 545 Z" fill="#ECE8E1"/>
  </g>

  <!-- Top X dimension (keep-out top 20 -> shield top 150) -->
  <line x1="640" y1="20"  x2="640" y2="150" stroke="#2A2A2A" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <line x1="610" y1="20"  x2="670" y2="20"  stroke="#2A2A2A" stroke-width="1"/>
  <line x1="610" y1="150" x2="670" y2="150" stroke="#2A2A2A" stroke-width="1"/>
  <text x="690" y="92" font-family="Archivo, Arial, sans-serif" font-size="46" font-weight="700" fill="#0E0E0E">X</text>

  <!-- Left X dimension (keep-out left 50 -> shield left 180) -->
  <line x1="50"  y1="320" x2="180" y2="320" stroke="#2A2A2A" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <line x1="50"  y1="290" x2="50"  y2="350" stroke="#2A2A2A" stroke-width="1"/>
  <line x1="180" y1="290" x2="180" y2="350" stroke="#2A2A2A" stroke-width="1"/>
  <text x="86" y="270" font-family="Archivo, Arial, sans-serif" font-size="46" font-weight="700" fill="#0E0E0E">X</text>

  <!-- Key: X defined by the chevron stroke -->
  <g transform="translate(70 1055)">
    <!-- mini chevron, scaled, to show the stroke band = X -->
    <g transform="scale(0.34)">
      <path d="M150 0 L350 195 L350 325 L150 130 L-50 325 L-50 195 Z" fill="#0E0E0E"/>
      <!-- brace marking the 130u stroke band on the right leg (y 195->325) -->
      <line x1="380" y1="195" x2="380" y2="325" stroke="#2A2A2A" stroke-width="4" marker-start="url(#arr)" marker-end="url(#arr)"/>
    </g>
    <text x="150" y="44" font-family="Archivo, Arial, sans-serif" font-size="30" font-weight="600" fill="#0E0E0E">X = chevron stroke height (130u at master scale)</text>
  </g>
</svg>
