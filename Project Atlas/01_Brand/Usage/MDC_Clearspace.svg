<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1140" role="img" aria-label="The Match Day Club shield clear space">
  <title>The Match Day Club — Clear Space</title>
  <!--
    Clear space = X on all sides, where X = the green down-chevron height (106u, y286->392).
    Shield bbox x200..800, y140..885. Keep-out = bbox expanded by X: 94, 894, 34, 991.
  -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9AA1AA"/>
    </marker>
    <mask id="mk">
      <rect width="1000" height="1000" fill="black"/>
      <path d="M330 700 L330 285 L500 500 L670 285 L670 700" fill="none" stroke="white" stroke-width="78" stroke-linejoin="miter" stroke-miterlimit="9"/>
      <path d="M330 700 L330 285 L500 500 L670 285 L670 700" fill="none" stroke="black" stroke-width="30" stroke-linejoin="miter" stroke-miterlimit="9"/>
    </mask>
  </defs>

  <!-- brand ground -->
  <rect width="1000" height="1140" fill="#0A0B0D"/>

  <!-- keep-out boundary -->
  <rect x="94" y="34" width="800" height="957" fill="none" stroke="#8BC63F" stroke-width="3" stroke-dasharray="14 10"/>

  <!-- mark -->
  <path fill-rule="evenodd" fill="#F5F7F8" d="M200 140 L800 140 L800 620 L500 885 L200 620 Z M252 196 L748 196 L748 596 L500 812 L252 596 Z"/>
  <path fill="#8BC63F" d="M448 286 L552 286 L500 392 Z"/>
  <rect width="1000" height="1000" fill="#F5F7F8" mask="url(#mk)"/>
  <rect x="482" y="500" width="36" height="205" fill="#8BC63F"/>

  <!-- top X dimension (keep-out 34 -> shield 140) -->
  <line x1="620" y1="34" x2="620" y2="140" stroke="#9AA1AA" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="640" y="98" font-family="Archivo, Arial, sans-serif" font-size="44" font-weight="700" fill="#F5F7F8">X</text>

  <!-- left X dimension (keep-out 94 -> shield 200) -->
  <line x1="94" y1="300" x2="200" y2="300" stroke="#9AA1AA" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="118" y="270" font-family="Archivo, Arial, sans-serif" font-size="44" font-weight="700" fill="#F5F7F8">X</text>

  <!-- key: X = green chevron height -->
  <g transform="translate(70 1030)">
    <path fill="#8BC63F" d="M0 0 L96 0 L48 60 Z"/>
    <line x1="120" y1="0" x2="120" y2="60" stroke="#9AA1AA" stroke-width="3" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <text x="150" y="44" font-family="Archivo, Arial, sans-serif" font-size="30" font-weight="600" fill="#F5F7F8">X = green chevron height (106u at master scale)</text>
  </g>
</svg>
