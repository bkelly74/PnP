<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 820" role="img" aria-label="The Match Day Club minimum size">
<title>The Match Day Club — Minimum Size</title>
<defs><path id="pi" fill-rule="evenodd" d="M2363 200 L176 200 L174 2166 L1267 2861 L2367 2166Z M1270 381 L349 383 L349 2059 L1275 2651 L2192 2058 L2192 384Z M686 580 L554 586 L554 1963 L755 2084 L763 826 L1233 1291 L1233 2397 L1282 2421 L1994 1961 L1994 583 L1736 580 L1277 1040 L820 585Z M1783 842 L1437 1184 L1439 2076 L1787 1854Z"/><path id="pg" d="M1099 586 L1273 796 L1451 612Z M772 838 L878 943 L872 2120 L766 2120Z"/><path id="pd" d=""/><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9AA1AA"/></marker></defs>
<rect width="1500" height="820" fill="#0A0B0D"/>
<text x="70" y="84" font-family="Archivo, Arial, sans-serif" font-size="46" font-weight="700" letter-spacing="3" fill="#F5F7F8">MINIMUM SIZE</text>
<line x1="70" y1="560" x2="1420" y2="560" stroke="#23282F" stroke-width="2"/>
<g transform="translate(130 100) scale(0.1673)"><g transform="translate(-129 -155)"><use href="#pi" fill="#F5F7F8" /><use href="#pg" fill="#8BC63F"/><use href="#pd" fill="#6AA62E"/></g></g><g transform="translate(650 293) scale(0.0971)"><g transform="translate(-129 -155)"><use href="#pi" fill="#F5F7F8" /><use href="#pg" fill="#8BC63F"/><use href="#pd" fill="#6AA62E"/></g></g><g transform="translate(990 376) scale(0.0669)"><g transform="translate(-129 -155)"><use href="#pi" fill="#F5F7F8" /><use href="#pg" fill="#8BC63F"/><use href="#pd" fill="#6AA62E"/></g></g>
<text x="130" y="610" font-family="Archivo, Arial, sans-serif" font-size="30" font-weight="700" fill="#F5F7F8">PREFERRED</text>
<text x="130" y="650" font-family="Archivo, Arial, sans-serif" font-size="27" fill="#9AA1AA">Use with breathing room.</text>
<text x="650" y="610" font-family="Archivo, Arial, sans-serif" font-size="30" font-weight="700" fill="#F5F7F8">DIGITAL FLOOR</text>
<text x="650" y="650" font-family="Archivo, Arial, sans-serif" font-size="27" fill="#9AA1AA">24px tall (shield).</text>
<text x="990" y="610" font-family="Archivo, Arial, sans-serif" font-size="30" font-weight="700" fill="#F5F7F8">EMBROIDERY FLOOR</text>
<text x="990" y="650" font-family="Archivo, Arial, sans-serif" font-size="27" fill="#9AA1AA">25mm — one-colour mark.</text>
<text x="70" y="780" font-family="Archivo, Arial, sans-serif" font-size="24" font-style="italic" fill="#7D848E">Shown to relative scale; labelled values are absolute production minimums, not the on-screen render size.</text>
</svg>