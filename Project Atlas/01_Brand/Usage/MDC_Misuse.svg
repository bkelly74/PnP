<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 1010" role="img" aria-label="The Match Day Club misuse">
<title>The Match Day Club — Misuse (Do Not)</title>
<defs><path id="pi" fill-rule="evenodd" d="M2363 200 L176 200 L174 2166 L1267 2861 L2367 2166Z M1270 381 L349 383 L349 2059 L1275 2651 L2192 2058 L2192 384Z M686 580 L554 586 L554 1963 L755 2084 L763 826 L1233 1291 L1233 2397 L1282 2421 L1994 1961 L1994 583 L1736 580 L1277 1040 L820 585Z M1783 842 L1437 1184 L1439 2076 L1787 1854Z"/><path id="pg" d="M1099 586 L1273 796 L1451 612Z M772 838 L878 943 L872 2120 L766 2120Z"/><path id="pd" d=""/>
<filter id="ds" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="16" dy="18" stdDeviation="14" flood-color="#000" flood-opacity="0.6"/></filter>
<g id="no" stroke="#FF5A5A" stroke-width="16" fill="none" stroke-opacity="0.95"><circle r="150"/><line x1="-106" y1="-106" x2="106" y2="106"/></g>
</defs>
<rect width="1520" height="1010" fill="#0A0B0D"/>
<text x="70" y="76" font-family="Archivo, Arial, sans-serif" font-size="46" font-weight="700" letter-spacing="3" fill="#F5F7F8">MISUSE — DO NOT</text>
<g transform="translate(260 300) scale(0.14175000000000001 0.0735) translate(-1142 -1375)"><g transform="translate(-129 -155)"><use href="#pi" fill="#F5F7F8" /><use href="#pg" fill="#8BC63F"/><use href="#pd" fill="#6AA62E"/></g></g><use href="#no" x="260" y="300"/>
<text x="260" y="485" text-anchor="middle" font-family="Archivo, Arial, sans-serif" font-size="30" font-weight="700" fill="#F5F7F8">DON'T STRETCH</text>
<text x="260" y="521" text-anchor="middle" font-family="Archivo, Arial, sans-serif" font-size="25" fill="#9AA1AA">Keep the aspect ratio locked.</text>
<g transform="translate(760 300) rotate(14) scale(0.105) translate(-1142 -1375)"><g transform="translate(-129 -155)"><use href="#pi" fill="#F5F7F8" /><use href="#pg" fill="#8BC63F"/><use href="#pd" fill="#6AA62E"/></g></g><use href="#no" x="760" y="300"/>
<text x="760" y="485" text-anchor="middle" font-family="Archivo, Arial, sans-serif" font-size="30" font-weight="700" fill="#F5F7F8">DON'T ROTATE</text>
<text x="760" y="521" text-anchor="middle" font-family="Archivo, Arial, sans-serif" font-size="25" fill="#9AA1AA">The shield sits upright.</text>
<g transform="translate(1260 300) scale(0.105) translate(-1142 -1375)"><g transform="translate(-129 -155)"><use href="#pi" fill="#1E63E6" /><use href="#pg" fill="#E64DBE"/><use href="#pd" fill="#7A2FB0"/></g></g><use href="#no" x="1260" y="300"/>
<text x="1260" y="485" text-anchor="middle" font-family="Archivo, Arial, sans-serif" font-size="30" font-weight="700" fill="#F5F7F8">DON'T RECOLOUR</text>
<text x="1260" y="521" text-anchor="middle" font-family="Archivo, Arial, sans-serif" font-size="25" fill="#9AA1AA">Ink and green only.</text>
<g filter="url(#ds)"><g transform="translate(260 770) scale(0.105) translate(-1142 -1375)"><g transform="translate(-129 -155)"><use href="#pi" fill="#F5F7F8" /><use href="#pg" fill="#8BC63F"/><use href="#pd" fill="#6AA62E"/></g></g></g><use href="#no" x="260" y="770"/>
<text x="260" y="955" text-anchor="middle" font-family="Archivo, Arial, sans-serif" font-size="30" font-weight="700" fill="#F5F7F8">DON'T ADD SHADOW</text>
<text x="260" y="991" text-anchor="middle" font-family="Archivo, Arial, sans-serif" font-size="25" fill="#9AA1AA">No drop shadows or glows.</text>
<g transform="translate(760 770) scale(0.105) translate(-1142 -1375)"><g transform="translate(-129 -155)"><use href="#pi" fill="#F5F7F8" stroke="#FF5A5A" stroke-width="44"/><use href="#pg" fill="#8BC63F"/><use href="#pd" fill="#6AA62E"/></g></g><use href="#no" x="760" y="770"/>
<text x="760" y="955" text-anchor="middle" font-family="Archivo, Arial, sans-serif" font-size="30" font-weight="700" fill="#F5F7F8">DON'T OUTLINE</text>
<text x="760" y="991" text-anchor="middle" font-family="Archivo, Arial, sans-serif" font-size="25" fill="#9AA1AA">The keyline is already the shield.</text>
<rect x="1110" y="620" width="300" height="300" rx="12" fill="#23282F"/><g transform="translate(1260 770) scale(0.105) translate(-1142 -1375)"><g transform="translate(-129 -155)"><use href="#pi" fill="#2A2F36" /><use href="#pg" fill="#2F3A22"/><use href="#pd" fill="#252E1C"/></g></g><use href="#no" x="1260" y="770"/>
<text x="1260" y="955" text-anchor="middle" font-family="Archivo, Arial, sans-serif" font-size="30" font-weight="700" fill="#F5F7F8">DON'T DROP CONTRAST</text>
<text x="1260" y="991" text-anchor="middle" font-family="Archivo, Arial, sans-serif" font-size="25" fill="#9AA1AA">Keep figure and ground clear.</text>
</svg>